<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beholder Sync</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"
        integrity="sha512-CSBhVREyzHAjAFfBlIBakjoRUKp5h7VSweP0InR/pAJyptH7peuhCsqAI/snV+TwZmXZqoUklpXp6R6wMnYf5Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
/* Colours, pills, tiles and tables follow beholder's status dashboard
   (src/datalab_beholder/server.py), so the two pages read the same. */
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1a1d21; --dim:#6b7280; --line:#e3e6ea;
  --ok:#177245; --okbg:#e7f4ec; --warn:#8a5a00; --warnbg:#fdf3e0;
  --bad:#a3231d; --badbg:#fbeceb; --idle:#4b5563; --idlebg:#eef0f3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171a; --card:#1d2024; --ink:#e6e8ea; --dim:#9aa3ad; --line:#2c3036;
  --ok:#6ee7a8; --okbg:#12301f; --warn:#f0c274; --warnbg:#33270e;
  --bad:#f29089; --badbg:#3a1a18; --idle:#9aa3ad; --idlebg:#24282d;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:0}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:20px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;
 font-weight:600;background:var(--idlebg);color:var(--idle)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
button{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);
 background:var(--card);border:1px solid var(--line);border-radius:999px;
 padding:3px 12px;cursor:pointer}
button:hover:enabled{border-color:var(--dim)}
button:disabled{color:var(--dim);cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
 padding:16px 18px;margin-bottom:16px}
button.cta{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px}
/* Each watched folder is a disclosure: the summary says which folder and how
   it is doing, the body holds its rules, problems and files. */
.watch>summary{list-style:none;font-weight:400;font-size:14px}
.watch>summary::-webkit-details-marker{display:none}
.cardhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.chev{display:inline-block;width:12px;font-size:11px;transition:transform .15s}
.watch[open] .chev{transform:rotate(90deg)}
.toggle{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--dim);
 border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.toggle::after{content:"Show details"} .watch[open] .toggle::after{content:"Hide details"}
.watch>summary:hover .toggle{border-color:var(--dim)}
.path{display:block;color:var(--dim);font-size:12.5px;font-family:ui-monospace,SFMono-Regular,
 Menlo,Consolas,monospace;word-break:break-all;margin:2px 0 4px 22px}
.tiles{display:flex;gap:2px 16px;flex-wrap:wrap;margin-left:22px;font-size:12.5px;color:var(--dim)}
.tile .n{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.tile.zero .n{color:var(--dim);font-weight:400}
.tile.bad .n{color:var(--bad)} .tile.warn .n{color:var(--warn)}
.watch>.live{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--line);
 vertical-align:top}
th{font-size:11.5px;color:var(--dim);text-transform:uppercase;
 letter-spacing:.05em;font-weight:600}
tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.err{color:var(--bad)} .okc{color:var(--ok)} .warnc{color:var(--warn)}
.scroll{overflow-x:auto}
.sec{font-size:11.5px;color:var(--dim);text-transform:uppercase;
 letter-spacing:.05em;font-weight:600;margin:16px 0 6px}
.empty{color:var(--dim);font-style:italic}
.banner{background:var(--badbg);color:var(--bad);border-radius:8px;
 padding:10px 14px;margin-bottom:16px;font-size:13px}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.note{color:var(--warn);font-size:13px;margin:-6px 0 14px}
summary{cursor:pointer;font-weight:600;font-size:15px}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 2px}
input,textarea,select{width:100%;padding:6px 8px;font:inherit;background:var(--bg);
 color:var(--ink);border:1px solid var(--line);border-radius:6px}
textarea{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
#yaml{min-height:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 14px}
.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.rules{display:grid;grid-template-columns:max-content 1fr;gap:1px 12px;margin:0 0 14px;font-size:12.5px}
.rules dt{color:var(--dim)} .rules dd{margin:0;word-break:break-all}
/* Edit patterns opens over the page: the boxes on the left and the preview
   of their effect on the right, one above the other on a narrow screen. */
dialog.edit{width:min(1180px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:18px 22px;
 background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px}
dialog.edit::backdrop{background:rgb(0 0 0 / .4)}
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;margin-top:4px}
@media (max-width:860px){.editor{grid-template-columns:1fr}}
.editor .grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.dlgerr:empty{display:none} .dlgerr{margin-top:12px}
label input,label textarea{margin-top:2px} label input{font-size:14px}
/* A label that wraps to two lines must not push its box below the others in
   the row, so each box sits at the bottom of its grid cell. The one-line
   regex box gets the height of an input. */
.grid label{display:flex;flex-direction:column;justify-content:space-between}
.grid textarea{line-height:21px}
.pair{display:flex;gap:6px;align-items:center} .pair button{white-space:nowrap}
.preview td+td{white-space:nowrap}
#log{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 max-height:260px;overflow-y:auto;white-space:pre-wrap;margin:0}
</style>
</head>
<body><div class="wrap">
<header><h1>beholder sync</h1><button id="resume" class="cta" hidden>Resume folder access</button>
<span id="state" class="pill">not started</span>
<button id="syncNow" disabled>Sync now</button></header>
<div class="sub" id="meta">Uploads cycler files from a folder on this computer to datalab while this tab is open.</div>
<div id="banners"></div>

<div class="listhead"><h2>Watched folders</h2><button id="addWatch">Add folder</button></div>
<div id="watches"></div>

<details class="card" id="settings">
  <summary>Datalab settings</summary>
  <label for="yaml">Paste a beholder config.yaml to set up the datalab and every watched path</label>
  <textarea id="yaml" spellcheck="false"></textarea>
  <div id="datalabChoice" hidden>
    <label for="datalabName">Datalab to upload to (this page uploads to one)</label>
    <select id="datalabName"></select>
  </div>
  <div class="actions"><button id="loadYaml">Load config</button></div>
  <div class="grid">
    <div><label for="apiUrl">datalab API URL</label><input id="apiUrl"></div>
    <div><label for="apiKey">API key</label><input id="apiKey" type="password" autocomplete="off"></div>
    <div><label for="intervalMin">Minutes between syncs</label><input id="intervalMin" type="number" min="1"></div>
  </div>
  <div class="actions"><button id="save">Save settings</button></div>
</details>

<details class="card">
  <summary>Log</summary>
  <div class="sec">Newest first, cleared when the tab closes</div>
  <pre id="log"></pre>
</details>
<div class="sub" id="foot"></div>
</div>

<script>
// Defaults for a new browser. Edit these before sending the page to a
// collaborator, so they only have to paste the API key and pick the folder.
const DEFAULTS = {
  apiUrl: "https://datalab.lightningtree.ai/api",
  apiKey: "",
  intervalMin: 10,
};
// The patterns of a new watched path. Each path is one entry of beholder's
// watched_paths: a folder and the rules for the files in it.
const DEFAULT_WATCH = {
  name: "cycler",
  path: "",
  itemType: "cells",
  include: "*.ndax",
  exclude: "",
  idPattern: ".*(?P<item_id>CEL-[0-9]{3,5}).*",
  itemTemplate: "{item_id}",
  collectionTemplate: "",
  blockPatterns: "*.ndax=cycle",
  maxDepth: 10,
};
const FIELDS = Object.keys(DEFAULTS);
const WATCH_FIELDS = Object.keys(DEFAULT_WATCH);
const MAX_BACKOFF_MIN = 60;

// ---------------------------------------------------------------- storage
// One IndexedDB database. "kv" holds the settings, the watched paths and one
// folder handle per path under "folder:<id>". "rows" holds one row per
// matched file, keyed by its path's id and its path relative to the folder.
function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("beholder-sync", 2);
    req.onupgradeneeded = (ev) => {
      const db = req.result;
      if (ev.oldVersion < 1) db.createObjectStore("kv");
      if (ev.oldVersion >= 2) return;
      const rows = db.createObjectStore("rows", { keyPath: ["watch", "path"] });
      // Version 1 watched one folder. Its rows move to the path "default",
      // which loadState makes from the old settings.
      if (ev.oldVersion === 1) {
        req.transaction.objectStore("files").getAll().onsuccess = (e) => {
          for (const r of e.target.result) rows.put({ ...r, watch: "default" });
          db.deleteObjectStore("files");
        };
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
const dbp = openDb();
async function tx(store, mode, fn) {
  const db = await dbp;
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const out = fn(t.objectStore(store));
    t.oncomplete = () => resolve(out && "result" in out ? out.result : out);
    t.onerror = () => reject(t.error);
    // A quota or internal failure aborts without an error event.
    t.onabort = () => reject(t.error || new Error("storage transaction aborted"));
  });
}
const kvGet = (k) => tx("kv", "readonly", (s) => s.get(k));
const kvSet = (k, v) => tx("kv", "readwrite", (s) => s.put(v, k));
const kvDel = (k) => tx("kv", "readwrite", (s) => s.delete(k));
// [id] sorts before every [id, path], and an array sorts after every string.
const ofWatch = (id) => IDBKeyRange.bound([id], [id, []]);
const filesAll = () => tx("rows", "readonly", (s) => s.getAll());
const filesOf = (id) => tx("rows", "readonly", (s) => s.getAll(ofWatch(id)));
const filePut = (row) => tx("rows", "readwrite", (s) => s.put(row));
const fileDel = (id, path) => tx("rows", "readwrite", (s) => s.delete([id, path]));
const filesDrop = (id) => tx("rows", "readwrite", (s) => s.delete(ofWatch(id)));

// --------------------------------------------------------------- matching
// Same semantics as beholder: globs match the basename case-insensitively
// (the cycler PCs are Windows), the ID regex is searched in the relative
// path, and templates use Python str.format field syntax.
function globToRegex(glob) {
  let re = "";
  for (let i = 0; i < glob.length; i++) {
    const c = glob[i];
    if (c === "*") re += ".*";
    else if (c === "?") re += ".";
    else if (c === "[") {
      // As fnmatch: a "]" straight after "[" or "[!" is a member, not the end.
      let j = i + 1;
      if (glob[j] === "!") j++;
      if (glob[j] === "]") j++;
      j = glob.indexOf("]", j);
      if (j < 0) { re += "\\["; continue; }
      let body = glob.slice(i + 1, j).replace(/\\/g, "\\\\").replace(/\]/g, "\\]");
      if (body[0] === "!") body = "^" + body.slice(1);
      else if (body[0] === "^") body = "\\" + body;
      re += "[" + body + "]";
      i = j;
    } else re += c.replace(/[.+^${}()|\\]/g, "\\$&");
  }
  return new RegExp("^" + re + "$", "is");
}
const splitList = (s) => s.split(",").map((x) => x.trim()).filter(Boolean);
// Python's (?P<name>...) and (?P=name) become JavaScript's (?<name>...) and \k<name>.
const pyRegex = (s) => new RegExp(s.replace(/\(\?P</g, "(?<").replace(/\(\?P=(\w+)\)/g, "\\k<$1>"));
function renderTemplate(tpl, groups) {
  return tpl.replace(/\{\{|\}\}|\{(\w+)\}/g, (m, name) => {
    if (m === "{{") return "{";
    if (m === "}}") return "}";
    if (!Object.hasOwn(groups, name)) throw new Error(`template field {${name}} has no capture group`);
    return groups[name];
  });
}

const apiBase = (url) => url.replace(/\/+$/, "");
function compileSettings(s) {
  return {
    ...s,
    apiUrl: apiBase(s.apiUrl),
    include: splitList(s.include || "*").map(globToRegex),
    exclude: splitList(s.exclude).map(globToRegex),
    idPatterns: s.idPattern.split("\n").map((x) => x.trim()).filter(Boolean).map(pyRegex),
    blocks: splitList(s.blockPatterns).map((p) => {
      const [glob, type] = p.split("=").map((x) => x.trim());
      return { re: globToRegex(glob), type };
    }),
    maxDepth: String(s.maxDepth).trim() === "" ? Infinity : Number(s.maxDepth),
  };
}

// ------------------------------------------------------------ config.yaml
// Maps a beholder config.yaml onto the datalab settings and one watched path
// per local path that uploads to the chosen datalab.
// Keys the file leaves out fall back to beholder's own defaults.
// A datalab's url may be the UI address or the API address, so compare them
// with any trailing /api removed.
const serverKey = (url) => String(url || "").trim().replace(/\/+$/, "").replace(/\/api$/, "").toLowerCase();
function settingsFromConfig(cfg, datalabName) {
  const datalabs = cfg.datalabs || [];
  const local = (cfg.watched_paths || []).filter((w) => (w.kind || "local") === "local");
  if (!local.length) throw new Error("the config has no local watched_paths");
  // Beholder lets a path leave out `datalab` only when the config has one.
  const target = (w) => w.datalab ?? (datalabs.length === 1 ? datalabs[0].name : undefined);
  const usable = datalabs.filter((d) => local.some((w) => target(w) === d.name));
  if (!usable.length) throw new Error("no local watched path names a datalab the config defines");
  // The page uploads to one datalab. Unless one is chosen, it takes the one
  // at DEFAULTS.apiUrl, and the first otherwise.
  const dl = usable.find((d) => d.name === datalabName)
    || usable.find((d) => serverKey(d.url) === serverKey(DEFAULTS.apiUrl)) || usable[0];
  const paths = local.filter((w) => target(w) === dl.name);
  const s = {
    apiUrl: dl.url,
    intervalMin: Math.max(1, Math.round((cfg.sync?.metadata_interval ?? 1200) / 60)),
  };
  // A missing key means beholder reads DATALAB_API_KEY from the environment.
  // Keep whatever key is already entered rather than blanking it.
  if (dl.api_key && dl.api_key !== "your-api-key-here") s.apiKey = dl.api_key;
  const watches = paths.map((wp, i) => ({
    name: wp.name || `path ${i + 1}`,
    path: wp.path || "",
    itemType: wp.item_type || "",
    include: (wp.include_patterns || ["*"]).join(", "),
    exclude: (wp.exclude_patterns || []).join(", "),
    idPattern: (wp.id_patterns || []).join("\n"),
    itemTemplate: wp.item_id_template || "",
    collectionTemplate: wp.collection_id_template || "",
    blockPatterns: Object.entries(wp.block_patterns || {}).map(([g, t]) => `${g}=${t}`).join(", "),
    maxDepth: wp.max_depth === null ? "" : String(wp.max_depth ?? 10),
  }));
  return { s, dl, paths, watches, datalabChoices: usable.map((d) => [d.name, d.url]) };
}

// Parses a config.yaml that may hold a few bad lines, so the rest still loads.
// Each failing line first loses its value, which leaves the key as null, and
// is commented out if it fails again. Returns the config and the lines skipped.
function loadYamlLenient(text) {
  const lines = text.split("\n"), skipped = [];
  for (let tries = 0; tries < 50; tries++) {
    try {
      return { cfg: jsyaml.load(lines.join("\n")), skipped };
    } catch (e) {
      const n = e.mark?.line;
      if (n == null || n >= lines.length || lines[n].trimStart().startsWith("#")) throw e;
      const keyed = lines[n].match(/^(\s*(?:-\s+)?[\w-]+:)\s+\S/);
      const again = skipped.some((k) => k.line === n + 1);
      lines[n] = keyed && !again ? keyed[1] + " null" : "#" + lines[n];
      if (!again) skipped.push({ line: n + 1, reason: e.reason || e.message });
    }
  }
  throw new Error("too many lines fail to parse");
}

// Beholder is given the UI address and finds the API from a meta tag in the
// page. The UI page sends no CORS headers, so a browser cannot read it.
// Instead try the address itself and then /api, and keep whichever answers
// /info with JSON.
async function resolveApiUrl(url) {
  const base = url.replace(/\/+$/, "");
  const candidates = /\/api$/.test(base) ? [base] : [base, base + "/api"];
  for (const c of candidates) {
    try {
      const res = await fetch(c + "/info");
      if (res.ok && (res.headers.get("content-type") || "").includes("json")) return c;
    } catch { /* blocked or unreachable, try the next one */ }
  }
  log(`could not reach ${base}; assuming the API is at ${candidates.at(-1)}`, "warn");
  return candidates.at(-1);
}

// Returns {item_id, collection_id} for a relative path, or null to skip it.
function idsFor(cfg, relPath, warn = (msg) => log(msg, "warn")) {
  let groups = {};
  if (cfg.idPatterns.length) {
    const m = cfg.idPatterns.map((re) => re.exec(relPath)).find(Boolean);
    if (!m) return null;
    for (const [k, v] of Object.entries(m.groups || {})) if (v !== undefined) groups[k] = v;
  }
  try {
    const ids = { ...groups };
    if (cfg.itemTemplate) ids.item_id = renderTemplate(cfg.itemTemplate, groups);
    if (cfg.collectionTemplate) ids.collection_id = renderTemplate(cfg.collectionTemplate, groups);
    return ids.item_id ? ids : null;
  } catch (e) {
    warn(`${cfg.name}: skip ${relPath}: ${e.message}`);
    return null;
  }
}

// Writes an item ID regex from one example ID: each run of digits matches
// any number of digits, and the rest is matched as typed. Beholder searches
// the path for the regex, so it needs no ".*" around it.
const idRegexFromExample = (ex) => "(?P<item_id>" + ex.trim().split(/(\d+)/)
  .map((p, i) => i % 2 ? "[0-9]+" : p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("") + ")";

// ------------------------------------------------------------------- scan
async function* walk(dir, cfg, prefix = "", depth = 0) {
  for await (const [name, handle] of dir.entries()) {
    if (cfg.exclude.some((re) => re.test(name))) continue;
    const rel = prefix + name;
    if (handle.kind === "directory") {
      if (depth < cfg.maxDepth) yield* walk(handle, cfg, rel + "/", depth + 1);
    } else if (cfg.include.some((re) => re.test(name))) {
      yield [rel, handle];
    }
  }
}

// Reconciles the folder with the stored rows. A file is pending when its
// size or modified time differs from the last version that reached datalab.
// Files that pass the include patterns but yield no item ID are counted, not
// stored: they can never upload, and the count is what explains that.
async function scan(root, cfg) {
  const rows = new Map((await filesOf(cfg.id)).map((r) => [r.path, r]));
  const seen = new Map();
  // Files that exist but could not be read this pass, for example while the
  // cycler holds them open. Their rows are kept so their sync state survives.
  const unreadable = new Set();
  let unattachable = 0;
  for await (const [rel, handle] of walk(root, cfg)) {
    const ids = idsFor(cfg, rel);
    if (!ids) { unattachable++; continue; }
    let file;
    try { file = await handle.getFile(); }
    catch (e) { log(`${cfg.name}: cannot read ${rel}: ${e.message}`, "warn"); unreadable.add(rel); continue; }
    const old = rows.get(rel);
    const row = { attempts: 0, nextTry: 0, ...old, watch: cfg.id, path: rel, size: file.size, mtime: file.lastModified,
                  itemId: ids.item_id, collectionId: ids.collection_id || null };
    if (row.size !== old?.size || row.mtime !== old?.mtime) { row.attempts = 0; row.nextTry = 0; }
    if (!old || row.size !== old.size || row.mtime !== old.mtime
        || row.itemId !== old.itemId || row.collectionId !== old.collectionId) await filePut(row);
    seen.set(rel, { row, handle });
  }
  for (const path of rows.keys()) if (!seen.has(path) && !unreadable.has(path)) await fileDel(cfg.id, path);
  if (unattachable) log(`${cfg.name}: ${unattachable} file(s) have no item ID and cannot be uploaded; check the Item ID regexes`, "warn");
  return { seen, unattachable };
}
const isPending = (r) => r.size !== r.syncedSize || r.mtime !== r.syncedMtime;

// -------------------------------------------------------------------- api
// Same endpoints and payloads as datalab-api's DatalabClient, which the
// Python beholder uses.
class ApiError extends Error {
  constructor(msg, status) { super(msg); this.status = status; }
}
async function api(cfg, method, path, { json, form, ok = [200] } = {}) {
  const headers = { "DATALAB-API-KEY": cfg.apiKey };
  let body;
  if (json !== undefined) { headers["Content-Type"] = "application/json"; body = JSON.stringify(json); }
  if (form) body = form;
  // A fetch that throws means the request never got an answer. It carries
  // no status, so callers treat it as transient.
  const res = await fetch(cfg.apiUrl + path, { method, headers, body });
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch { /* non-JSON body */ }
  if (!ok.includes(res.status)) {
    throw new ApiError(`HTTP ${res.status} at ${path}: ${data.message || text.slice(0, 200)}`, res.status);
  }
  return { status: res.status, data };
}

async function fetchItem(cfg, itemId) {
  try {
    const { data } = await api(cfg, "GET", `/get-item-data/${encodeURIComponent(itemId)}`);
    const item = data.item_data;
    const shown = new Set(item.display_order || []);
    item.blocks_obj = Object.fromEntries(
      Object.entries(item.blocks_obj || {}).filter(([id]) => shown.has(id)));
    return item;
  } catch (e) {
    if (e.status === 404) return null;
    throw e;
  }
}

async function collectionRef(cfg, collectionId) {
  const get = async () =>
    (await api(cfg, "GET", `/collections/${encodeURIComponent(collectionId)}`)).data.data.immutable_id;
  try { return await get(); }
  catch (e) {
    // Only a missing collection is created. A refused key or a server error is not "missing".
    if (e.status !== 404) throw e;
    await api(cfg, "PUT", "/collections",
      { json: { data: { collection_id: collectionId, type: "collections" } }, ok: [201] });
    return await get();
  }
}

async function ensureItem(cfg, itemId, collectionId) {
  const item = await fetchItem(cfg, itemId);
  if (item) return item;
  if (!cfg.itemType) throw new Error(`item ${itemId} does not exist and no item type is set`);
  log(`creating item ${itemId} (type ${cfg.itemType}${collectionId ? `, collection ${collectionId}` : ""})`);
  const sample = { item_id: itemId, type: cfg.itemType };
  if (collectionId) sample.collections = [{ immutable_id: await collectionRef(cfg, collectionId) }];
  await api(cfg, "POST", "/new-sample/",
    { json: { new_sample_data: sample, generate_id_automatically: false }, ok: [201] });
  return { files: [], blocks_obj: {} };
}

// Matches on original_name first because the server's `name` is
// secure_filename(original_name), which turns spaces into underscores.
function existingFileId(item, filename) {
  const target = filename.toLowerCase();
  for (const f of item.files || []) {
    for (const key of ["original_name", "name"]) {
      if (f[key] && f[key].toLowerCase() === target) return f.immutable_id || null;
    }
  }
  return null;
}

async function upload(cfg, itemId, file, replaceId) {
  const form = new FormData();
  form.append("file", file, file.name);
  form.append("item_id", itemId);
  // The server reads replace_file with no default, so a new file sends it empty.
  form.append("replace_file", replaceId || "");
  const { status, data } = await api(cfg, "POST", "/upload-file/", { form, ok: [201, 304] });
  // 304: the server compared hashes and already holds this content.
  if (status === 304) return { file_id: replaceId, not_modified: true };
  return { ...data, not_modified: false };
}

async function createBlock(cfg, itemId, blockType, fileId) {
  const { data } = await api(cfg, "POST", "/add-data-block/",
    { json: { item_id: itemId, block_type: blockType, index: null } });
  const block = { ...data.new_block_obj, file_id: fileId };
  await api(cfg, "POST", "/update-block/",
    { json: { block_data: block, block_type: blockType, save_to_db: true }, ok: [200, 202] });
}

// ------------------------------------------------------------------- sync
// `due` holds {row, handle, cfg} from every watched path. They share one
// datalab, so one /info check and one item cache serve them all.
async function attachPending(due) {
  // Every pass asks datalab, even with nothing to send, so the header says
  // whether it answered at the last sync. An outage is not each file's
  // fault, so it costs no attempts.
  try { await api({ apiUrl: apiBase(global.apiUrl), apiKey: global.apiKey }, "GET", "/info"); status.serverError = null; }
  catch (e) {
    status.serverError = e.message;
    log(`datalab unreachable${due.length ? `, leaving ${due.length} file(s) pending` : ""}: ${e.message}`, "warn");
    return;
  }
  if (!due.length) return;

  log(`attaching ${due.length} file(s)`);
  const items = new Map();
  for (const { row, handle, cfg } of due) {
    try {
      if (!items.has(row.itemId)) items.set(row.itemId, await ensureItem(cfg, row.itemId, row.collectionId));
      const item = items.get(row.itemId);
      const file = await handle.getFile();
      const replaceId = existingFileId(item, file.name);
      const result = await upload(cfg, row.itemId, file, replaceId);
      // The item is cached for the pass, so record the new file on it. A second
      // file of the same name for this item then replaces it instead of duplicating it.
      if (!replaceId && result.file_id) {
        item.files = [...(item.files || []), { original_name: file.name, immutable_id: result.file_id }];
      }

      // Marked synced as soon as the bytes are on the server, so a failed
      // block step never causes a re-upload.
      Object.assign(row, { syncedSize: file.size, syncedMtime: file.lastModified,
                           size: file.size, mtime: file.lastModified,
                           attempts: 0, nextTry: 0, lastError: null, lastErrorAt: null,
                           lastSynced: Date.now() });
      await filePut(row);
      log(result.not_modified ? `${cfg.name}: ${row.path} already up to date on ${row.itemId}`
        : `${cfg.name}: attached ${row.path} -> ${row.itemId}${replaceId ? " (replaced)" : ""}`, "ok");

      const block = cfg.blocks.find((b) => b.re.test(file.name));
      const fileId = result.file_id;
      const hasBlock = Object.values(item.blocks_obj || {})
        .some((b) => b.blocktype === block?.type && b.file_id === fileId);
      if (block && fileId && !hasBlock) {
        try {
          await createBlock(cfg, row.itemId, block.type, fileId);
          item.blocks_obj = { ...item.blocks_obj, [`new-${fileId}`]: { blocktype: block.type, file_id: fileId } };
          log(`${cfg.name}: created ${block.type} block on ${row.itemId} for ${row.path}`, "ok");
        } catch (e) {
          log(`could not create ${block.type} block on ${row.itemId}: ${e.message}`, "bad");
        }
      }
    } catch (e) {
      row.attempts = (row.attempts || 0) + 1;
      row.nextTry = Date.now() + Math.min(MAX_BACKOFF_MIN, 2 ** (row.attempts - 1)) * 60_000;
      row.lastError = e.message;
      row.lastErrorAt = Date.now();
      await filePut(row);
      log(`${cfg.name}: failed ${row.path}: ${e.message}`, "bad");
    }
  }
}

// ---------------------------------------------------------------- page glue
const $ = (id) => document.getElementById(id);
let timer = null;
// The datalab settings, and the watched paths in the order of the cards.
let global = { ...DEFAULTS };
let watches = [];
// What the page knows beyond the stored rows. `problem` is a banner about
// setup (no key, invalid settings); `serverError` is the last failed /info.
const status = { syncing: false, problem: null, serverError: null,
                 lastPassAt: null, nextAt: null, unsupported: false };
// Per watched path: `root` is the folder being read, `handle` one stored but
// awaiting permission, and `error` why the last scan of it failed.
const wstate = new Map();
const ws = (id) => { if (!wstate.has(id)) wstate.set(id, {}); return wstate.get(id); };
const watchOf = (id) => watches.find((w) => w.id === id);
const active = () => watches.filter((w) => ws(w.id).root);
const newId = () => Math.random().toString(36).slice(2, 10);

function log(msg, cls = "") {
  const line = document.createElement("div");
  line.textContent = `${new Date().toLocaleTimeString()}  ${msg}`;
  if (cls) line.className = { ok: "okc", warn: "warnc", bad: "err" }[cls] || "";
  $("log").prepend(line);
  while ($("log").childElementCount > 500) $("log").lastChild.remove();
}
function setProblem(text) { status.problem = text; render(); }

const pick = (keys, o) => Object.fromEntries(keys.map((k) => [k, o[k] ?? ""]));
async function loadState() {
  const saved = (await kvGet("settings")) || {};
  global = pick(FIELDS, { ...DEFAULTS, ...saved });
  watches = await kvGet("watches");
  if (!watches) {
    // A new browser, or one from before several paths. Then the settings held
    // the one path's patterns and its folder was stored under "folder".
    const { name, path, ...patterns } = DEFAULT_WATCH;
    watches = [{ id: "default", name, path: (await kvGet("configPath")) || "",
                 ...pick(Object.keys(patterns), { ...patterns, ...saved }) }];
    const folder = await kvGet("folder");
    if (folder) await kvSet("folder:default", folder);
    await kvSet("watches", watches);
    await kvSet("settings", global);
  }
  for (const k of FIELDS) $(k).value = global[k];
}
const saveWatches = () => kvSet("watches", watches);

// Forgets a watched path: its folder, its rows and its card. Files already
// on datalab stay there.
async function dropWatch(id) {
  await filesDrop(id);
  await kvDel("folder:" + id);
  wstate.delete(id);
  watches = watches.filter((w) => w.id !== id);
}

// The formatting helpers are the dashboard's, taking milliseconds here
// because that is what Date and File report.
function ago(t) {
  if (!t) return "never";
  const d = (Date.now() - t) / 1000;
  const a = Math.abs(d), f = d < 0 ? "in " : "", s = d < 0 ? "" : " ago";
  let v;
  if (a < 45) v = Math.round(a) + "s";
  else if (a < 3600) v = Math.round(a / 60) + " min";
  else if (a < 86400) v = (a / 3600).toFixed(1) + " h";
  else v = (a / 86400).toFixed(1) + " d";
  return f + v + s;
}
const T = (t) => t ? `<span title="${new Date(t).toLocaleString()}">${ago(t)}</span>` : '<span class="empty">never</span>';
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bytes = (n) => n == null ? "" :
  n < 1024 ? n + " B" :
  n < 1048576 ? (n / 1024).toFixed(0) + " KB" :
  n < 1073741824 ? (n / 1048576).toFixed(1) + " MB" : (n / 1073741824).toFixed(2) + " GB";
const tile = (n, label, cls) =>
  `<span class="tile ${cls || (n ? "" : "zero")}"><span class="n">${n}</span> <span class="l">${label}</span></span>`;
const code = (s) => `<span class="mono">${esc(s)}</span>`;

// One card per watched path, as on beholder's dashboard. The edit form is
// built once here, so the 15-second refresh in render() never wipes a box
// being typed in. render() fills only each card's summary and .live part.
// The boxes run in rows on a wide screen: which path, which files, how a
// file gets its item ID, and what is made for it.
const WATCH_INPUTS = [
  ["name", "Name"],
  ["path", "Folder path from config.yaml (checks the folder you pick)"],
  ["itemType", "Item type for new items"],
  ["include", "Include patterns (comma separated)"],
  ["exclude", "Exclude patterns (comma separated)"],
  ["maxDepth", "Max folder depth (blank for unlimited)", "number"],
  ["idPattern", "Item ID regexes, one per line (named group <code>item_id</code>)", "textarea"],
  ["example", "Or build the regex from an example item ID", "example"],
  ["itemTemplate", "Item ID template"],
  ["collectionTemplate", "Collection ID template (blank for none)"],
  ["blockPatterns", "Block patterns (<code>glob=blocktype</code>, comma separated)"],
].map(([k, label, kind]) => `<label><span>${label}</span>${kind === "textarea"
  ? `<textarea name="${k}" rows="1" spellcheck="false"></textarea>`
  : kind === "example"
  ? `<span class="pair"><input name="${k}" placeholder="CEL-081" spellcheck="false"><button data-act="example">Build regex</button></span>`
  : `<input name="${k}"${kind === "number" ? ' type="number" min="0"' : ""}>`}</label>`).join("");
function buildCards() {
  if (!watches.length) {
    $("watches").innerHTML = `<div class="card empty">No watched folders yet. Paste a config.yaml
      under Datalab settings, or click Add folder.</div>`;
    return;
  }
  // A card stays open or closed across a rebuild. A new one opens only when
  // it has no folder yet, since choosing one is the next step.
  const wasOpen = new Map([...document.querySelectorAll(".watch")].map((c) => [c.dataset.id, c.open]));
  $("watches").replaceChildren(...watches.map((w) => {
    const card = document.createElement("details");
    card.className = "card watch";
    card.dataset.id = w.id;
    card.dataset.name = w.name;
    card.open = wasOpen.get(w.id) ?? !ws(w.id).handle;
    card.innerHTML = `<summary></summary><div class="live"></div>
      <dialog class="edit"><h2></h2>
        <div class="editor"><div class="grid">${WATCH_INPUTS}</div>
          <div><div class="sec">Preview on the chosen folder</div><div class="preview"></div></div></div>
        <div class="err dlgerr"></div>
        <div class="actions"><button data-act="save">Save patterns</button><button data-act="cancel">Cancel</button>
          <button data-act="remove" style="margin-left:auto">Remove this path</button></div>
      </dialog>`;
    for (const k of WATCH_FIELDS) card.querySelector(`[name=${k}]`).value = w[k];
    return card;
  }));
}
const readWatch = (card) =>
  Object.fromEntries(WATCH_FIELDS.map((k) => [k, card.querySelector(`[name=${k}]`).value.trim()]));

// The rules a path syncs by, in a few lines, so each card says what it picks up.
function rulesHtml(w) {
  const rule = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
  const depth = String(w.maxDepth).trim() === "" ? "any depth" : `up to ${esc(w.maxDepth)} folders down`;
  const ids = w.idPattern.split("\n").map((x) => x.trim()).filter(Boolean);
  let h = rule("Files", code(w.include || "*") + (w.exclude ? `, except ${code(w.exclude)}` : "") + `, ${depth}`);
  h += rule("Item ID", (ids.length ? ids.map(code).join(" or ") : "every file")
    + (w.itemTemplate && w.itemTemplate !== "{item_id}" ? ` &rarr; ${code(w.itemTemplate)}` : ""));
  h += rule("New items", `type ${w.itemType ? code(w.itemType) : '<span class="err">none set</span>'}`
    + (w.collectionTemplate ? `, in collection ${code(w.collectionTemplate)}` : ""));
  if (w.blockPatterns) h += rule("Blocks", splitList(w.blockPatterns)
    .map((p) => code(p.split("=").map((x) => x.trim()).join(" → "))).join(", "));
  return `<dl class="rules">${h}</dl>`;
}

function watchHtml(w, rows) {
  const st = ws(w.id);
  const pending = rows.filter(isPending);
  const stuck = pending.filter((r) => r.attempts > 0)
    .sort((a, b) => b.attempts - a.attempts || (b.lastErrorAt || 0) - (a.lastErrorAt || 0));
  const recent = rows.filter((r) => r.lastSynced).sort((a, b) => b.lastSynced - a.lastSynced).slice(0, 10);

  const [cls, word] = st.patternError ? ["bad", "invalid patterns"]
    : st.error ? ["bad", "folder unreadable"]
    : st.root ? (stuck.length ? ["warn", stuck.length + " stuck"] : ["ok", "watching"])
    : st.handle ? ["warn", "needs access"] : ["", "no folder"];
  // The summary answers which folder this is and how it is doing, so a list
  // of closed cards still reads as an overview.
  // A <summary> holds only phrasing content and headings, hence spans.
  let s = `<span class="cardhead"><span class="chev">&#9654;</span><h2>${esc(w.name || "unnamed")}</h2>
    <span class="pill ${cls}">${word}</span><span class="toggle"></span></span>`;
  const folder = st.root || st.handle;
  s += `<span class="path">${folder ? `Folder ${esc(folder.name || "(unnamed)")}` : "No folder chosen"}`
    + (w.path ? ` &middot; config path ${esc(w.path)}` : "") + `</span>`;
  if (st.root || rows.length) {
    s += `<span class="tiles">
      ${tile(rows.length - pending.length, "synced")}
      ${tile(pending.length, "pending", pending.length ? "warn" : "")}
      ${tile(stuck.length, "stuck", stuck.length ? "bad" : "")}
      ${tile(st.unattachable || 0, "no item_id", st.unattachable ? "warn" : "")}
      <span class="tile"><span class="l">last upload</span> <span class="n">${T(recent[0]?.lastSynced)}</span></span>
    </span>`;
  }

  let h = "";
  if (st.patternError) h += `<div class="banner">This path was skipped because its patterns
    cannot be used: ${esc(st.patternError)}. Fix them under Edit patterns.</div>`;
  if (st.error) h += `<div class="banner">The last sync could not read this folder: ${esc(st.error)}.
    If it was moved or renamed, choose it again.</div>`;
  if (st.handle && !st.root) h += `<div class="banner warn">Chrome needs your permission again
    before it can read this folder. Click Resume folder access at the top of the page.</div>`;
  if (st.folderWarning) h += `<div class="banner warn">${esc(st.folderWarning)}</div>`;
  const off = status.unsupported ? " disabled" : "";
  h += `<div class="actions" style="margin:0 0 14px"><button data-act="pick"${off}>${st.root ? "Choose a different folder" : "Choose folder"}</button>`
    + `<button data-act="edit">Edit patterns</button></div>`;
  h += `<div class="sec">Rules</div>` + rulesHtml(w);
  if (st.unattachable) {
    h += `<div class="note">${st.unattachable} file(s) match the include patterns but no
      Item ID regex, so they will never upload. Check the regexes under Edit patterns.</div>`;
  }
  if (stuck.length) {
    // No deadline on a file that is still failing means Sync now cleared
    // its backoff, so it goes on the next pass.
    h += `<div class="sec">Not uploading</div><div class="scroll"><table>
      <tr><th>File</th><th>Item</th><th>Attempts</th><th>Last failure</th><th>Next try</th><th>Error</th></tr>`;
    // The ten that have failed most often. A datalab refusing every upload
    // would otherwise list the whole folder.
    for (const r of stuck.slice(0, 10)) {
      h += `<tr><td class="mono">${esc(r.path)}</td><td class="mono">${esc(r.itemId)}</td>
        <td class="mono">${r.attempts}</td><td>${T(r.lastErrorAt)}</td>
        <td>${r.nextTry > Date.now() ? T(r.nextTry) : "next pass"}</td>
        <td class="err mono">${esc(r.lastError)}</td></tr>`;
    }
    h += `</table></div>`;
    if (stuck.length > 10) h += `<div class="empty">and ${stuck.length - 10} more not uploading</div>`;
  }
  if (recent.length) {
    h += `<div class="sec">Recently uploaded</div><div class="scroll"><table class="recent">
      <tr><th>File</th><th>Item</th><th>Size</th><th>When</th></tr>`;
    for (const r of recent) {
      h += `<tr><td class="mono">${esc(r.path)}</td><td class="mono">${esc(r.itemId)}</td>
        <td class="mono">${bytes(r.syncedSize)}</td><td>${T(r.lastSynced)}</td></tr>`;
    }
    h += `</table></div>`;
  }
  return [s, h];
}

async function render() {
  const rows = await filesAll();
  const byWatch = new Map(watches.map((w) => [w.id, []]));
  for (const r of rows) byWatch.get(r.watch)?.push(r);
  const mine = [...byWatch.values()].flat();
  const stuck = mine.filter((r) => isPending(r) && r.attempts > 0).length;
  const failing = watches.filter((w) => ws(w.id).error || ws(w.id).patternError).length;
  const idle = watches.length - active().length;

  // The header sums the cards, worst first, as beholder's header pill does.
  const pill = $("state");
  const set = (cls, text) => { pill.className = "pill " + cls; pill.textContent = text; };
  if (status.unsupported) set("bad", "unsupported browser");
  else if (!active().length) set("", "not started");
  else if (status.syncing) set("", "syncing");
  else if (status.serverError) set("bad", "datalab unreachable");
  else if (failing) set("bad", `${failing} folder${failing > 1 ? "s" : ""} failing`);
  else if (idle) set("warn", `${idle} folder${idle > 1 ? "s" : ""} not syncing`);
  else if (stuck) set("warn", stuck + " stuck");
  else set("ok", "running");
  $("syncNow").disabled = !active().length || status.syncing;
  $("syncNow").textContent = status.syncing ? "syncing" : "Sync now";
  const waiting = watches.filter((w) => ws(w.id).handle && !ws(w.id).root).length;
  $("resume").hidden = !waiting;

  const bits = [];
  const host = (() => { try { return new URL(global.apiUrl).host; } catch { return ""; } })();
  if (host) bits.push(esc(host));
  bits.push(`${active().length} of ${watches.length} folder${watches.length === 1 ? "" : "s"} syncing`);
  if (active().length && status.nextAt) bits.push("next sync " + ago(status.nextAt));
  if (status.lastPassAt) bits.push("last sync " + ago(status.lastPassAt));
  bits.push("runs only while this tab is open");
  $("meta").innerHTML = bits.join(" &middot; ");

  let b = "";
  if (status.unsupported) b += `<div class="banner">This browser cannot read folders. Open this page in Chrome or Edge.</div>`;
  if (status.problem) b += `<div class="banner warn">${esc(status.problem)}</div>`;
  if (status.serverError) b += `<div class="banner">datalab did not answer on the last sync, so no
    files were uploaded and none were counted as failed: ${esc(status.serverError)}</div>`;
  $("banners").innerHTML = b;

  for (const card of document.querySelectorAll(".watch")) {
    const w = watchOf(card.dataset.id);
    if (!w) continue;
    const [summary, body] = watchHtml(w, byWatch.get(w.id));
    card.querySelector("summary").innerHTML = summary;
    card.querySelector(".live").innerHTML = body;
    // A card opens once when it starts failing, so its reason is in view.
    // The user can close it again.
    const st = ws(w.id);
    const failing = !!(st.error || st.patternError || byWatch.get(w.id).some((r) => isPending(r) && r.attempts > 0));
    if (failing && !st.shownFailing) card.open = true;
    st.shownFailing = failing;
  }
  $("foot").textContent = "updated " + new Date().toLocaleTimeString();
}

// One pass scans every folder, then uploads what is due. Passes run one at a
// time: a pass asked for while one runs waits for it, and several such asks
// share one pass. `now` is the Sync now button. Like the dashboard's, it also
// clears the backoff on failing files so they are retried on this pass.
let pass = Promise.resolve(), queued = null;
function syncOnce({ now = false } = {}) {
  if (queued) { queued.now ||= now; return pass; }
  const opts = queued = { now };
  pass = pass.then(() => { queued = null; return syncPass(opts); })
    .catch((e) => log(`sync failed: ${e.message}`, "bad"));
  return pass;
}
// Runs fn after the pass in progress and any queued one, so that removing a
// path never happens halfway through a pass that is still writing its rows.
function exclusive(fn) {
  const p = pass.then(fn);
  pass = p.catch(() => {});
  return p;
}
async function syncPass({ now }) {
  if (!active().length) return;
  // Two open tabs would upload every file twice. The lock lets one sync at a time.
  await navigator.locks.request("beholder-sync", { ifAvailable: true }, async (lock) => {
    if (!lock) { log("another tab is syncing, skipped this run", "warn"); return; }
    if (!global.apiKey) { setProblem("Enter the API key in Datalab settings, then Save settings."); return; }
    status.problem = null;
    status.syncing = true;
    await render();
    try {
      if (now) {
        for (const r of await filesAll()) if (r.nextTry) await filePut({ ...r, nextTry: 0 });
      }
      const due = [];
      for (const w of active()) {
        const st = ws(w.id);
        let cfg;
        try { cfg = compileSettings({ ...global, ...w }); st.patternError = null; }
        catch (e) {
          Object.assign(st, { patternError: e.message, unattachable: 0 });
          log(`${w.name}: skipped, the patterns are invalid: ${e.message}`, "bad");
          continue;
        }
        try {
          const { seen, unattachable } = await scan(st.root, cfg);
          Object.assign(st, { unattachable, error: null });
          const t = Date.now();
          for (const { row, handle } of seen.values()) {
            if (isPending(row) && row.nextTry <= t) due.push({ row, handle, cfg });
          }
        } catch (e) {
          // One unreadable folder must not stop the other paths.
          Object.assign(st, { error: e.message, unattachable: 0 });
          log(`${w.name}: scan failed: ${e.message}`, "bad");
        }
      }
      await attachPending(due);
      status.lastPassAt = Date.now();
    } catch (e) {
      log(`sync failed: ${e.message}`, "bad");
      status.problem = `The last sync stopped with an error: ${e.message}`;
    } finally {
      status.syncing = false;
    }
    await render();
  });
}

function schedule() {
  clearInterval(timer);
  if (!active().length) { status.nextAt = null; return; }
  const ms = Math.max(1, Number(global.intervalMin) || DEFAULTS.intervalMin) * 60_000;
  status.nextAt = Date.now() + ms;
  timer = setInterval(() => { status.nextAt = Date.now() + ms; syncOnce(); }, ms);
}

// A page cannot open a folder by its path. From the config's path it can
// still start the dialog in a well-known folder on the way there, and check
// that the folder picked has the name the config expects.
const WELL_KNOWN = ["desktop", "documents", "downloads", "music", "pictures", "videos"];
function folderHints(path) {
  const parts = String(path || "").split(/[\\/]+/).filter(Boolean);
  const startIn = parts.map((x) => x.toLowerCase()).findLast((x) => WELL_KNOWN.includes(x));
  return { startIn, expected: parts.length > 1 ? parts.at(-1) : null };
}
function folderWarning(name, path) {
  const { expected } = folderHints(path);
  if (!expected || !name || name.toLowerCase() === expected.toLowerCase()) return null;
  return `You chose the folder "${name}", but the config watches "${expected}" (${path}). ` +
    "If that is not the folder this instrument writes to, click Choose a different folder.";
}

async function useFolder(id, handle, { sync = true } = {}) {
  Object.assign(ws(id), { root: handle, handle, error: null,
                          folderWarning: folderWarning(handle.name, watchOf(id).path) });
  schedule();
  if (sync) await syncOnce();
  else await render();
}

// Lists files in the folder with the item ID each would get under the rules
// in the edit form, before they are saved. Files with no ID come first, since
// they are what needs fixing. Only the first PREVIEW_MAX files are walked.
const PREVIEW_MAX = 2000;
const previewTimers = new Map();
function previewSoon(card) {
  if (!card.querySelector(".edit").open) return;
  clearTimeout(previewTimers.get(card.dataset.id));
  previewTimers.set(card.dataset.id, setTimeout(() => preview(card), 400));
}
async function preview(card) {
  const out = card.querySelector(".preview");
  const st = ws(card.dataset.id);
  // Each call outdates the ones before, so a walk still running for older
  // patterns stops and does not overwrite what this one shows.
  const seq = card.dataset.previewSeq = String(Number(card.dataset.previewSeq || 0) + 1);
  const stale = () => card.dataset.previewSeq !== seq;
  if (!st.root) {
    out.innerHTML = `<div class="empty">${st.handle ? "Resume folder access" : "Choose a folder"}
      to see the item ID each file gets.</div>`;
    return;
  }
  let cfg;
  try { cfg = compileSettings({ ...global, ...readWatch(card) }); }
  catch (e) { out.innerHTML = `<div class="err">These patterns cannot be used: ${esc(e.message)}</div>`; return; }
  const files = [];
  let problem = null;
  try {
    for await (const [rel] of walk(st.root, cfg)) {
      if (stale()) return;
      files.push([rel, idsFor(cfg, rel, (msg) => { problem = msg; })]);
      if (files.length >= PREVIEW_MAX) break;
    }
  } catch (e) { problem = `could not read the folder: ${e.message}`; }
  if (stale()) return;

  const missing = files.filter(([, ids]) => !ids);
  const shown = missing.slice(0, 5);
  shown.push(...files.filter(([, ids]) => ids).slice(0, 10 - shown.length));
  let h = `<div>${files.length}${files.length >= PREVIEW_MAX ? "+" : ""} file(s) match the include patterns. `
    + (!files.length ? "" : missing.length
      ? `<span class="err">${missing.length} ${missing.length === 1 ? "gets" : "get"} no item ID and would not upload.</span>`
      : `<span class="okc">Every one gets an item ID.</span>`) + `</div>`;
  // The table shows only a few files, so a wrong ID taken from some of them,
  // such as a channel number, could hide. The distinct IDs in sort order put
  // such outliers at the ends of the list.
  const distinct = [...new Set(files.map(([, ids]) => ids?.item_id).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  if (distinct.length) {
    const lens = distinct.map((x) => x.length);
    const list = distinct.length <= 8 ? distinct
      : [...distinct.slice(0, 4), "…", ...distinct.slice(-4)];
    h += `<div>${distinct.length} distinct item ID${distinct.length === 1 ? "" : "s"}: `
      + list.map((x) => x === "…" ? x : code(x)).join(", ")
      + `. ${Math.min(...lens) === Math.max(...lens) ? `All ${lens[0]}` : `${Math.min(...lens)} to ${Math.max(...lens)}`} characters long.</div>`;
  }
  if (problem) h += `<div class="err">${esc(problem)}</div>`;
  if (shown.length) {
    h += `<div class="scroll"><table><tr><th>File</th><th>Item ID</th>${cfg.collectionTemplate ? "<th>Collection</th>" : ""}</tr>`;
    for (const [rel, ids] of shown) {
      h += `<tr><td class="mono">${esc(rel)}</td>`
        + `<td class="mono">${ids ? esc(ids.item_id) : '<span class="err">no item ID</span>'}</td>`
        + (cfg.collectionTemplate ? `<td class="mono">${esc(ids?.collection_id)}</td>` : "") + `</tr>`;
    }
    h += `</table></div>`;
  }
  out.innerHTML = h;
}

const actions = {
  // Opens the editor with the saved patterns, so edits abandoned by Cancel
  // or Escape do not come back.
  async edit(w, card) {
    for (const k of WATCH_FIELDS) card.querySelector(`[name=${k}]`).value = w[k];
    card.querySelector("[name=example]").value = "";
    card.querySelector(".dlgerr").textContent = "";
    card.querySelector(".edit h2").textContent = `Edit patterns for ${w.name}`;
    card.querySelector(".edit").showModal();
    await preview(card);
  },
  async cancel(w, card) { card.querySelector(".edit").close(); },
  async example(w, card) {
    const ex = card.querySelector("[name=example]").value;
    if (!ex.trim()) return;
    // Digits alone become [0-9]+, which takes the first number anywhere in
    // the path, such as a channel number. Letters alone match one fixed
    // string, so every file would go to one item. Either makes wrong items.
    const msg = card.querySelector(".dlgerr");
    if (!/[a-z]/i.test(ex) || !/\d/.test(ex)) {
      msg.textContent = "The example needs letters and a number, such as CEL-081, for the page to find " +
        "IDs like it in file names. For any other kind of ID, write the regex by hand.";
      return;
    }
    msg.textContent = "";
    card.querySelector("[name=idPattern]").value = idRegexFromExample(ex);
    await preview(card);
  },
  async pick(w) {
    let handle;
    // The browser remembers the last folder picked under each id, and that
    // takes precedence over startIn after the first pick.
    const { startIn } = folderHints(w.path);
    try { handle = await window.showDirectoryPicker({ id: "bs-" + w.id, mode: "read", ...(startIn && { startIn }) }); }
    catch (e) { if (e.name !== "AbortError") setProblem(`Could not open the folder: ${e.message}`); return; }
    await kvSet("folder:" + w.id, handle);
    await useFolder(w.id, handle);
  },
  async save(w, card) {
    const fields = readWatch(card);
    try {
      if (!fields.name) throw new Error("the path needs a name");
      if (watches.some((o) => o !== w && o.name === fields.name)) throw new Error(`another path is already named ${fields.name}`);
      compileSettings({ ...global, ...fields });
    } catch (e) { card.querySelector(".dlgerr").textContent = `Not saved: ${e.message}.`; return; }
    Object.assign(w, fields);
    card.dataset.name = w.name;
    await saveWatches();
    const st = ws(w.id);
    if (st.root) st.folderWarning = folderWarning(st.root.name, w.path);
    log(`${w.name}: patterns saved`);
    card.querySelector(".edit").close();
    await render();
  },
  async remove(w) {
    if (!confirm(`Stop syncing ${w.name || "this path"}? Files already on datalab stay there.`)) return;
    await exclusive(async () => { await dropWatch(w.id); await saveWatches(); });
    log(`${w.name}: removed`);
    buildCards();
    schedule();
    await render();
  },
};
$("watches").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  const card = b?.closest(".watch");
  if (!card) return;
  actions[b.dataset.act](watchOf(card.dataset.id), card)
    .catch((err) => { log(`${b.textContent} failed: ${err.message}`, "bad"); setProblem(`${b.textContent} failed: ${err.message}`); });
});
// The preview follows the edit form as it is typed in.
$("watches").addEventListener("input", (e) => {
  const card = e.target.closest(".watch");
  if (card && e.target.closest(".edit") && e.target.name !== "example") previewSoon(card);
});
$("addWatch").onclick = async () => {
  let n = watches.length + 1;
  while (watches.some((w) => w.name === `path ${n}`)) n++;
  watches.push({ ...DEFAULT_WATCH, id: newId(), name: `path ${n}` });
  await saveWatches();
  buildCards();
  const card = document.querySelector(".watch:last-child");
  card.open = true;
  await render();
  await actions.edit(watchOf(card.dataset.id), card);
};
$("syncNow").onclick = () => syncOnce({ now: true });
// Asks again for every folder whose permission lapsed with the last browser
// session. Chrome's prompt may restore several at once, so each is checked
// before it is asked. If Chrome refuses a second prompt from one click, the
// button stays up for the folders left, and the next click asks for those.
$("resume").onclick = async () => {
  let resumed = false;
  try {
    for (const w of watches) {
      const { handle, root } = ws(w.id);
      if (!handle || root) continue;
      let p = await handle.queryPermission({ mode: "read" });
      if (p !== "granted") {
        try { p = await handle.requestPermission({ mode: "read" }); }
        catch (e) {
          // Chrome refuses a second prompt from one click with a SecurityError.
          // Any other error belongs to this folder, so the rest are still asked.
          if (e.name === "SecurityError") { log("Chrome needs another click on Resume folder access for the other folders"); break; }
          log(`${w.name}: access not resumed: ${e.message}. Choose the folder again.`, "warn");
          continue;
        }
      }
      if (p === "granted") { await useFolder(w.id, handle, { sync: false }); resumed = true; }
    }
  } catch (e) { log(`Resume folder access failed: ${e.message}`, "bad"); setProblem(`Resume folder access failed: ${e.message}`); }
  if (resumed) await syncOnce();
};
$("save").onclick = async () => {
  const s = Object.fromEntries(FIELDS.map((k) => [k, $(k).value.trim()]));
  try { if (!/^https?:$/.test(new URL(s.apiUrl).protocol)) throw 0; }
  catch { setProblem("Settings not saved: the datalab API URL must start with https:// or http://."); return; }
  if (!(Number(s.intervalMin) >= 1)) { setProblem("Settings not saved: minutes between syncs must be 1 or more."); return; }
  global = s;
  await kvSet("settings", global);
  log("settings saved");
  status.problem = null;
  schedule();
  await render();
};
$("loadYaml").onclick = async () => {
  try {
    const { cfg, skipped } = loadYamlLenient($("yaml").value);
    // A file name, a path or an empty box parses as a string or nothing.
    if (!cfg || typeof cfg !== "object" || Array.isArray(cfg)) {
      throw new Error("the box does not hold a config. Paste the text inside config.yaml, not its file name or path");
    }
    const { s, dl, paths, watches: incoming, datalabChoices } = settingsFromConfig(cfg, $("datalabName").value);
    for (const w of incoming) {
      try { compileSettings({ ...global, ...s, ...w }); }
      catch (e) { throw new Error(`watched path ${w.name}: ${e.message}`); }
    }
    // With several datalabs, the first load picks one and shows a dropdown.
    // Choosing another and pressing Load again loads it.
    $("datalabName").replaceChildren(...datalabChoices.map(([n, url]) => new Option(`${n} (${url})`, n)));
    $("datalabName").value = dl.name;
    $("datalabChoice").hidden = datalabChoices.length < 2;
    s.apiUrl = await resolveApiUrl(s.apiUrl);
    global = { ...global, ...s };
    for (const k of FIELDS) $(k).value = global[k];
    await kvSet("settings", global);

    // The config replaces the watched paths. One already set up keeps its id,
    // and so its folder and sync state, when it has the same name, else the
    // same folder path, else a chosen folder named as the path's last part.
    // The last covers a path set up by hand, which has no config name or path.
    await exclusive(async () => {
      const ids = [];
      const claim = (same) => incoming.forEach((n, i) => {
        ids[i] ??= watches.find((o) => same(o, n) && !ids.includes(o.id))?.id;
      });
      claim((o, n) => o.name === n.name);
      claim((o, n) => !!n.path && o.path === n.path);
      claim((o, n) => {
        const picked = ws(o.id).handle?.name, expected = folderHints(n.path).expected;
        return !!picked && !!expected && picked.toLowerCase() === expected.toLowerCase();
      });
      for (const o of [...watches]) {
        if (!ids.includes(o.id)) { await dropWatch(o.id); log(`${o.name}: removed, the config does not list it`); }
      }
      watches = incoming.map((n, i) => ({ ...n, id: ids[i] || newId() }));
      await saveWatches();
    });
    buildCards();
    for (const w of active()) ws(w.id).folderWarning = folderWarning(ws(w.id).root.name, w.path);
    log(`loaded ${watches.length} watched path(s) for datalab ${dl.name} from config.yaml: ` +
        watches.map((w) => w.name).join(", "), "ok");

    const problems = [];
    if (skipped.length) {
      problems.push(`Config loaded without ${skipped.map((k) => `line ${k.line} (${k.reason})`).join(", ")}. ` +
        "Those keys were left empty. Fix them in config.yaml and load again." + windowsPathHint(skipped));
    }
    if (!global.apiKey) {
      problems.push("The config has no api_key. Enter it in the API key box and Save settings.");
    }
    status.problem = problems.join(" ") || null;
    for (const wp of paths) {
      if ((wp.id_patterns || []).some((p) => p.includes("?P<group_id>"))) {
        log(`${wp.name}: this page does not share new items with a group_id; set sharing in datalab`, "warn");
      }
      // "C:\temp" in double quotes parses, but \t becomes a tab.
      if (/[\x00-\x1f]/.test(wp.path || "")) {
        log(`${wp.name}: the path ${JSON.stringify(wp.path)} holds a control character; quote Windows paths with single quotes`, "warn");
      }
    }
    schedule();
    await render();
  } catch (e) {
    setProblem(`Config not loaded: ${e.message}` + windowsPathHint([{ reason: e.message }]));
  }
};
// Inside double quotes YAML reads a backslash as an escape, so a pasted
// Windows path such as "C:\Users\..." fails to parse.
const windowsPathHint = (skipped) => skipped.some((k) => /escape sequence|hexadecimal character/.test(k.reason))
  ? " A Windows path needs single quotes ('C:\\Users\\...'), forward slashes, or doubled backslashes." : "";

(async () => {
  await loadState();
  $("settings").open = !global.apiKey;
  // Keeps the "ago" times current between syncs, as the dashboard's poll does.
  setInterval(render, 15_000);
  if (!window.showDirectoryPicker) {
    status.unsupported = true;
    buildCards();
    await render();
    return;
  }
  // The grant survives a restart only if the user chose "Allow on every visit".
  // Every folder that kept it joins before the first pass, so one pass covers all.
  let resumed = false;
  // One stored folder that cannot be read back must not hide the others.
  for (const w of watches) {
    try {
      const handle = await kvGet("folder:" + w.id);
      if (!handle) continue;
      if ((await handle.queryPermission({ mode: "read" })) === "granted") {
        await useFolder(w.id, handle, { sync: false });
        resumed = true;
      } else ws(w.id).handle = handle;
    } catch (e) { log(`${w.name}: the stored folder could not be restored: ${e.message}. Choose it again.`, "warn"); }
  }
  // Built once the stored folders are known, so only cards without one open.
  buildCards();
  if (resumed) await syncOnce();
  else await render();
})();
// Exposed for the test harness, which drives a sync against a folder it builds.
window.beholder = { useFolder, syncOnce, filesAll, compileSettings, idsFor, globToRegex, settingsFromConfig,
                    loadYamlLenient, folderHints, folderWarning,
                    watchId: (name) => watches.find((w) => w.name === name)?.id, settings: () => global };
</script>
</body>
</html>
