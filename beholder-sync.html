<script>
// Defaults for a new browser. Edit these before sending the page to a
// collaborator, so they only have to paste the API key and pick the folder.
const DEFAULTS = {
  apiUrl: "https://datalab.lightningtree.ai/api",
  apiKey: "",
  itemType: "cells",
  intervalMin: 10,
  include: "*.ndax",
  exclude: "",
  idPattern: ".*(?P<item_id>CEL-[0-9]{3,5}).*",
  itemTemplate: "{item_id}",
  collectionTemplate: "",
  blockPatterns: "*.ndax=cycle",
  maxDepth: 10,
};
const FIELDS = Object.keys(DEFAULTS);
const MAX_BACKOFF_MIN = 60;

// ---------------------------------------------------------------- storage
// One IndexedDB database. "kv" holds settings and the folder handle; "files"
// holds one row per matched file, keyed by its path relative to the folder.
function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("beholder-sync", 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore("kv");
      req.result.createObjectStore("files", { keyPath: "path" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
const dbp = openDb();
async function tx(store, mode, fn) {
  const db = await dbp;
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const out = fn(t.objectStore(store));
    t.oncomplete = () => resolve(out && "result" in out ? out.result : out);
    t.onerror = () => reject(t.error);
    // A quota or internal failure aborts without an error event.
    t.onabort = () => reject(t.error || new Error("storage transaction aborted"));
  });
}
const kvGet = (k) => tx("kv", "readonly", (s) => s.get(k));
const kvSet = (k, v) => tx("kv", "readwrite", (s) => s.put(v, k));
const filesAll = () => tx("files", "readonly", (s) => s.getAll());
const filePut = (row) => tx("files", "readwrite", (s) => s.put(row));
const fileDel = (path) => tx("files", "readwrite", (s) => s.delete(path));

// --------------------------------------------------------------- matching
// Same semantics as beholder: globs match the basename case-insensitively
// (the cycler PCs are Windows), the ID regex is searched in the relative
// path, and templates use Python str.format field syntax.
function globToRegex(glob) {
  let re = "";
  for (let i = 0; i < glob.length; i++) {
    const c = glob[i];
    if (c === "*") re += ".*";
    else if (c === "?") re += ".";
    else if (c === "[") {
      // As fnmatch: a "]" straight after "[" or "[!" is a member, not the end.
      let j = i + 1;
      if (glob[j] === "!") j++;
      if (glob[j] === "]") j++;
      j = glob.indexOf("]", j);
      if (j < 0) { re += "\\["; continue; }
      let body = glob.slice(i + 1, j).replace(/\\/g, "\\\\").replace(/\]/g, "\\]");
      if (body[0] === "!") body = "^" + body.slice(1);
      else if (body[0] === "^") body = "\\" + body;
      re += "[" + body + "]";
      i = j;
    } else re += c.replace(/[.+^${}()|\\]/g, "\\$&");
  }
  return new RegExp("^" + re + "$", "is");
}
const splitList = (s) => s.split(",").map((x) => x.trim()).filter(Boolean);
// Python's (?P<name>...) and (?P=name) become JavaScript's (?<name>...) and \k<name>.
const pyRegex = (s) => new RegExp(s.replace(/\(\?P</g, "(?<").replace(/\(\?P=(\w+)\)/g, "\\k<$1>"));
function renderTemplate(tpl, groups) {
  return tpl.replace(/\{\{|\}\}|\{(\w+)\}/g, (m, name) => {
    if (m === "{{") return "{";
    if (m === "}}") return "}";
    if (!Object.hasOwn(groups, name)) throw new Error(`template field {${name}} has no capture group`);
    return groups[name];
  });
}

function compileSettings(s) {
  return {
    ...s,
    apiUrl: s.apiUrl.replace(/\/+$/, ""),
    include: splitList(s.include || "*").map(globToRegex),
    exclude: splitList(s.exclude).map(globToRegex),
    idPatterns: s.idPattern.split("\n").map((x) => x.trim()).filter(Boolean).map(pyRegex),
    blocks: splitList(s.blockPatterns).map((p) => {
      const [glob, type] = p.split("=").map((x) => x.trim());
      return { re: globToRegex(glob), type };
    }),
    maxDepth: String(s.maxDepth).trim() === "" ? Infinity : Number(s.maxDepth),
  };
}

// ------------------------------------------------------------ config.yaml
// Maps one watched path of a beholder config.yaml onto the settings boxes.
// Keys the file leaves out fall back to beholder's own defaults.
// A datalab's url may be the UI address or the API address, so compare them
// with any trailing /api removed.
const serverKey = (url) => String(url || "").trim().replace(/\/+$/, "").replace(/\/api$/, "").toLowerCase();
function settingsFromConfig(cfg, pathName, datalabName) {
  const datalabs = cfg.datalabs || [];
  const local = (cfg.watched_paths || []).filter((w) => (w.kind || "local") === "local");
  if (!local.length) throw new Error("the config has no local watched_paths");
  // Beholder lets a path leave out `datalab` only when the config has one.
  const target = (w) => w.datalab ?? (datalabs.length === 1 ? datalabs[0].name : undefined);
  const usable = datalabs.filter((d) => local.some((w) => target(w) === d.name));
  if (!usable.length) throw new Error("no local watched path names a datalab the config defines");
  // The page uploads to one datalab. Unless one is chosen, it takes the one
  // at DEFAULTS.apiUrl, and the first otherwise.
  const dl = usable.find((d) => d.name === datalabName)
    || usable.find((d) => serverKey(d.url) === serverKey(DEFAULTS.apiUrl)) || usable[0];
  const paths = local.filter((w) => target(w) === dl.name);
  const wp = paths.find((w) => w.name === pathName) || paths[0];
  const s = {
    apiUrl: dl.url,
    itemType: wp.item_type || "",
    intervalMin: Math.max(1, Math.round((cfg.sync?.metadata_interval ?? 1200) / 60)),
    include: (wp.include_patterns || ["*"]).join(", "),
    exclude: (wp.exclude_patterns || []).join(", "),
    idPattern: (wp.id_patterns || []).join("\n"),
    itemTemplate: wp.item_id_template || "",
    collectionTemplate: wp.collection_id_template || "",
    blockPatterns: Object.entries(wp.block_patterns || {}).map(([g, t]) => `${g}=${t}`).join(", "),
    maxDepth: wp.max_depth === null ? "" : String(wp.max_depth ?? 10),
  };
  // A missing key means beholder reads DATALAB_API_KEY from the environment.
  // Keep whatever key is already entered rather than blanking it.
  if (dl.api_key && dl.api_key !== "your-api-key-here") s.apiKey = dl.api_key;
  return { s, wp, dl, names: paths.map((w) => w.name),
           datalabChoices: usable.map((d) => [d.name, d.url]) };
}

// Parses a config.yaml that may hold a few bad lines, so the rest still loads.
// Each failing line first loses its value, which leaves the key as null, and
// is commented out if it fails again. Returns the config and the lines skipped.
function loadYamlLenient(text) {
  const lines = text.split("\n"), skipped = [];
  for (let tries = 0; tries < 50; tries++) {
    try {
      return { cfg: jsyaml.load(lines.join("\n")), skipped };
    } catch (e) {
      const n = e.mark?.line;
      if (n == null || n >= lines.length || lines[n].trimStart().startsWith("#")) throw e;
      const keyed = lines[n].match(/^(\s*(?:-\s+)?[\w-]+:)\s+\S/);
      const again = skipped.some((k) => k.line === n + 1);
      lines[n] = keyed && !again ? keyed[1] + " null" : "#" + lines[n];
      if (!again) skipped.push({ line: n + 1, reason: e.reason || e.message });
    }
  }
  throw new Error("too many lines fail to parse");
}

// Beholder is given the UI address and finds the API from a meta tag in the
// page. The UI page sends no CORS headers, so a browser cannot read it.
// Instead try the address itself and then /api, and keep whichever answers
// /info with JSON.
async function resolveApiUrl(url) {
  const base = url.replace(/\/+$/, "");
  const candidates = /\/api$/.test(base) ? [base] : [base, base + "/api"];
  for (const c of candidates) {
    try {
      const res = await fetch(c + "/info");
      if (res.ok && (res.headers.get("content-type") || "").includes("json")) return c;
    } catch { /* blocked or unreachable, try the next one */ }
  }
  log(`could not reach ${base}; assuming the API is at ${candidates.at(-1)}`, "warn");
  return candidates.at(-1);
}

// Returns {item_id, collection_id} for a relative path, or null to skip it.
function idsFor(cfg, relPath) {
  let groups = {};
  if (cfg.idPatterns.length) {
    const m = cfg.idPatterns.map((re) => re.exec(relPath)).find(Boolean);
    if (!m) return null;
    for (const [k, v] of Object.entries(m.groups || {})) if (v !== undefined) groups[k] = v;
  }
  try {
    const ids = { ...groups };
    if (cfg.itemTemplate) ids.item_id = renderTemplate(cfg.itemTemplate, groups);
    if (cfg.collectionTemplate) ids.collection_id = renderTemplate(cfg.collectionTemplate, groups);
    return ids.item_id ? ids : null;
  } catch (e) {
    log(`skip ${relPath}: ${e.message}`, "warn");
    return null;
  }
}

// ------------------------------------------------------------------- scan
async function* walk(dir, cfg, prefix = "", depth = 0) {
  for await (const [name, handle] of dir.entries()) {
    if (cfg.exclude.some((re) => re.test(name))) continue;
    const rel = prefix + name;
    if (handle.kind === "directory") {
      if (depth < cfg.maxDepth) yield* walk(handle, cfg, rel + "/", depth + 1);
    } else if (cfg.include.some((re) => re.test(name))) {
      yield [rel, handle];
    }
  }
}

// Reconciles the folder with the stored rows. A file is pending when its
// size or modified time differs from the last version that reached datalab.
// Files that pass the include patterns but yield no item ID are counted, not
// stored: they can never upload, and the count is what explains that.
async function scan(root, cfg) {
  const rows = new Map((await filesAll()).map((r) => [r.path, r]));
  const seen = new Map();
  // Files that exist but could not be read this pass, for example while the
  // cycler holds them open. Their rows are kept so their sync state survives.
  const unreadable = new Set();
  let unattachable = 0;
  for await (const [rel, handle] of walk(root, cfg)) {
    const ids = idsFor(cfg, rel);
    if (!ids) { unattachable++; continue; }
    let file;
    try { file = await handle.getFile(); }
    catch (e) { log(`cannot read ${rel}: ${e.message}`, "warn"); unreadable.add(rel); continue; }
    const old = rows.get(rel);
    const row = { attempts: 0, nextTry: 0, ...old, path: rel, size: file.size, mtime: file.lastModified,
                  itemId: ids.item_id, collectionId: ids.collection_id || null };
    if (row.size !== old?.size || row.mtime !== old?.mtime) { row.attempts = 0; row.nextTry = 0; }
    if (!old || row.size !== old.size || row.mtime !== old.mtime
        || row.itemId !== old.itemId || row.collectionId !== old.collectionId) await filePut(row);
    seen.set(rel, { row, handle });
  }
  for (const path of rows.keys()) if (!seen.has(path) && !unreadable.has(path)) await fileDel(path);
  if (unattachable) log(`${unattachable} file(s) have no item ID and cannot be uploaded; check the Item ID regexes`, "warn");
  return { seen, unattachable };
}
const isPending = (r) => r.size !== r.syncedSize || r.mtime !== r.syncedMtime;

// -------------------------------------------------------------------- api
// Same endpoints and payloads as datalab-api's DatalabClient, which the
// Python beholder uses.
class ApiError extends Error {
  constructor(msg, status) { super(msg); this.status = status; }
}
async function api(cfg, method, path, { json, form, ok = [200] } = {}) {
  const headers = { "DATALAB-API-KEY": cfg.apiKey };
  let body;
  if (json !== undefined) { headers["Content-Type"] = "application/json"; body = JSON.stringify(json); }
  if (form) body = form;
  // A fetch that throws means the request never got an answer. It carries
  // no status, so callers treat it as transient.
  const res = await fetch(cfg.apiUrl + path, { method, headers, body });
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch { /* non-JSON body */ }
  if (!ok.includes(res.status)) {
    throw new ApiError(`HTTP ${res.status} at ${path}: ${data.message || text.slice(0, 200)}`, res.status);
  }
  return { status: res.status, data };
}

async function fetchItem(cfg, itemId) {
  try {
    const { data } = await api(cfg, "GET", `/get-item-data/${encodeURIComponent(itemId)}`);
    const item = data.item_data;
    const shown = new Set(item.display_order || []);
    item.blocks_obj = Object.fromEntries(
      Object.entries(item.blocks_obj || {}).filter(([id]) => shown.has(id)));
    return item;
  } catch (e) {
    if (e.status === 404) return null;
    throw e;
  }
}

async function collectionRef(cfg, collectionId) {
  const get = async () =>
    (await api(cfg, "GET", `/collections/${encodeURIComponent(collectionId)}`)).data.data.immutable_id;
  try { return await get(); }
  catch (e) {
    // Only a missing collection is created. A refused key or a server error is not "missing".
    if (e.status !== 404) throw e;
    await api(cfg, "PUT", "/collections",
      { json: { data: { collection_id: collectionId, type: "collections" } }, ok: [201] });
    return await get();
  }
}

async function ensureItem(cfg, itemId, collectionId) {
  const item = await fetchItem(cfg, itemId);
  if (item) return item;
  if (!cfg.itemType) throw new Error(`item ${itemId} does not exist and no item type is set`);
  log(`creating item ${itemId} (type ${cfg.itemType}${collectionId ? `, collection ${collectionId}` : ""})`);
  const sample = { item_id: itemId, type: cfg.itemType };
  if (collectionId) sample.collections = [{ immutable_id: await collectionRef(cfg, collectionId) }];
  await api(cfg, "POST", "/new-sample/",
    { json: { new_sample_data: sample, generate_id_automatically: false }, ok: [201] });
  return { files: [], blocks_obj: {} };
}

// Matches on original_name first because the server's `name` is
// secure_filename(original_name), which turns spaces into underscores.
function existingFileId(item, filename) {
  const target = filename.toLowerCase();
  for (const f of item.files || []) {
    for (const key of ["original_name", "name"]) {
      if (f[key] && f[key].toLowerCase() === target) return f.immutable_id || null;
    }
  }
  return null;
}

async function upload(cfg, itemId, file, replaceId) {
  const form = new FormData();
  form.append("file", file, file.name);
  form.append("item_id", itemId);
  if (replaceId) form.append("replace_file", replaceId);
  const { status, data } = await api(cfg, "POST", "/upload-file/", { form, ok: [201, 304] });
  // 304: the server compared hashes and already holds this content.
  if (status === 304) return { file_id: replaceId, not_modified: true };
  return { ...data, not_modified: false };
}

async function createBlock(cfg, itemId, blockType, fileId) {
  const { data } = await api(cfg, "POST", "/add-data-block/",
    { json: { item_id: itemId, block_type: blockType, index: null } });
  const block = { ...data.new_block_obj, file_id: fileId };
  await api(cfg, "POST", "/update-block/",
    { json: { block_data: block, block_type: blockType, save_to_db: true }, ok: [200, 202] });
}

// ------------------------------------------------------------------- sync
async function attachPending(cfg, seen) {
  const now = Date.now();
  const due = [...seen.values()].filter(({ row }) => isPending(row) && row.nextTry <= now);
  // With nothing to send no request is made, so an old outage no longer applies.
  if (!due.length) { status.serverError = null; return; }

  // A server outage is not each file's fault, so it costs no attempts.
  try { await api(cfg, "GET", "/info"); status.serverError = null; }
  catch (e) {
    status.serverError = e.message;
    log(`datalab unreachable, leaving ${due.length} file(s) pending: ${e.message}`, "warn");
    return;
  }

  log(`attaching ${due.length} file(s)`);
  const items = new Map();
  for (const { row, handle } of due) {
    try {
      if (!items.has(row.itemId)) items.set(row.itemId, await ensureItem(cfg, row.itemId, row.collectionId));
      const item = items.get(row.itemId);
      const file = await handle.getFile();
      const replaceId = existingFileId(item, file.name);
      const result = await upload(cfg, row.itemId, file, replaceId);
      // The item is cached for the pass, so record the new file on it. A second
      // file of the same name for this item then replaces it instead of duplicating it.
      if (!replaceId && result.file_id) {
        item.files = [...(item.files || []), { original_name: file.name, immutable_id: result.file_id }];
      }

      // Marked synced as soon as the bytes are on the server, so a failed
      // block step never causes a re-upload.
      Object.assign(row, { syncedSize: file.size, syncedMtime: file.lastModified,
                           size: file.size, mtime: file.lastModified,
                           attempts: 0, nextTry: 0, lastError: null, lastErrorAt: null,
                           lastSynced: Date.now() });
      await filePut(row);
      log(result.not_modified ? `${row.path} already up to date on ${row.itemId}`
        : `attached ${row.path} -> ${row.itemId}${replaceId ? " (replaced)" : ""}`, "ok");

      const block = cfg.blocks.find((b) => b.re.test(file.name));
      const fileId = result.file_id;
      const hasBlock = Object.values(item.blocks_obj || {})
        .some((b) => b.blocktype === block?.type && b.file_id === fileId);
      if (block && fileId && !hasBlock) {
        try {
          await createBlock(cfg, row.itemId, block.type, fileId);
          item.blocks_obj = { ...item.blocks_obj, [`new-${fileId}`]: { blocktype: block.type, file_id: fileId } };
          log(`created ${block.type} block on ${row.itemId} for ${row.path}`, "ok");
        } catch (e) {
          log(`could not create ${block.type} block on ${row.itemId}: ${e.message}`, "bad");
        }
      }
    } catch (e) {
      row.attempts = (row.attempts || 0) + 1;
      row.nextTry = Date.now() + Math.min(MAX_BACKOFF_MIN, 2 ** (row.attempts - 1)) * 60_000;
      row.lastError = e.message;
      row.lastErrorAt = Date.now();
      await filePut(row);
      log(`failed ${row.path}: ${e.message}`, "bad");
    }
  }
}

// ---------------------------------------------------------------- page glue
const $ = (id) => document.getElementById(id);
let root = null;
let timer = null;
// What the page knows beyond the stored rows. `problem` is a banner about
// setup (no key, no folder access); `serverError` is the last failed /info.
const status = { syncing: false, problem: null, folderWarning: null, serverError: null, unattachable: 0,
                 lastPassAt: null, nextAt: null, unsupported: false };

function log(msg, cls = "") {
  const line = document.createElement("div");
  line.textContent = `${new Date().toLocaleTimeString()}  ${msg}`;
  if (cls) line.className = { ok: "okc", warn: "warnc", bad: "err" }[cls] || "";
  $("log").prepend(line);
  while ($("log").childElementCount > 500) $("log").lastChild.remove();
}
function setProblem(text) { status.problem = text; render(); }

async function loadSettings() {
  const saved = (await kvGet("settings")) || {};
  const s = { ...DEFAULTS, ...saved };
  for (const k of FIELDS) $(k).value = s[k];
  return s;
}
function readSettings() {
  return Object.fromEntries(FIELDS.map((k) => [k, $(k).value.trim()]));
}

// The formatting helpers are the dashboard's, taking milliseconds here
// because that is what Date and File report.
function ago(t) {
  if (!t) return "never";
  const d = (Date.now() - t) / 1000;
  const a = Math.abs(d), f = d < 0 ? "in " : "", s = d < 0 ? "" : " ago";
  let v;
  if (a < 45) v = Math.round(a) + "s";
  else if (a < 3600) v = Math.round(a / 60) + " min";
  else if (a < 86400) v = (a / 3600).toFixed(1) + " h";
  else v = (a / 86400).toFixed(1) + " d";
  return f + v + s;
}
const T = (t) => t ? `<span title="${new Date(t).toLocaleString()}">${ago(t)}</span>` : '<span class="empty">never</span>';
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bytes = (n) => n == null ? "" :
  n < 1024 ? n + " B" :
  n < 1048576 ? (n / 1024).toFixed(0) + " KB" :
  n < 1073741824 ? (n / 1048576).toFixed(1) + " MB" : (n / 1073741824).toFixed(2) + " GB";
const tile = (n, label, cls) =>
  `<div class="tile ${cls || ""}"><div class="n">${n}</div><div class="l">${label}</div></div>`;

async function render() {
  const rows = await filesAll();
  const pending = rows.filter(isPending);
  const stuck = pending.filter((r) => r.attempts > 0)
    .sort((a, b) => b.attempts - a.attempts || (b.lastErrorAt || 0) - (a.lastErrorAt || 0));
  const recent = rows.filter((r) => r.lastSynced).sort((a, b) => b.lastSynced - a.lastSynced).slice(0, 10);
  const lastUpload = recent[0]?.lastSynced;

  const pill = $("state");
  if (status.unsupported) { pill.className = "pill bad"; pill.textContent = "unsupported browser"; }
  else if (!root) { pill.className = "pill"; pill.textContent = "not started"; }
  else if (status.syncing) { pill.className = "pill"; pill.textContent = "syncing"; }
  else if (status.serverError) { pill.className = "pill bad"; pill.textContent = "datalab unreachable"; }
  else if (stuck.length) { pill.className = "pill warn"; pill.textContent = stuck.length + " stuck"; }
  else { pill.className = "pill ok"; pill.textContent = "running"; }
  $("syncNow").disabled = !root || status.syncing;
  $("syncNow").textContent = status.syncing ? "syncing" : "Sync now";

  const bits = [];
  const host = (() => { try { return new URL($("apiUrl").value).host; } catch { return ""; } })();
  if (host) bits.push(esc(host));
  if (root && status.nextAt) bits.push("next sync " + ago(status.nextAt));
  if (status.lastPassAt) bits.push("last sync " + ago(status.lastPassAt));
  bits.push("runs only while this tab is open");
  $("meta").innerHTML = bits.join(" &middot; ");

  let b = "";
  if (status.unsupported) b += `<div class="banner">This browser cannot read folders. Open this page in Chrome or Edge.</div>`;
  if (status.problem) b += `<div class="banner warn">${esc(status.problem)}</div>`;
  if (status.folderWarning) b += `<div class="banner warn">${esc(status.folderWarning)}</div>`;
  if (status.serverError) b += `<div class="banner">datalab did not answer on the last sync, so no
    files were uploaded and none were counted as failed: ${esc(status.serverError)}</div>`;
  $("banners").innerHTML = b;

  let h = `<div class="tiles">
    ${tile(rows.length - pending.length, "synced")}
    ${tile(pending.length, "pending", pending.length ? "warn" : "")}
    ${tile(stuck.length, "stuck", stuck.length ? "bad" : "")}
    ${tile(status.unattachable, "no item_id", status.unattachable ? "warn" : "")}
    <div class="tile"><div class="n" style="font-size:15px;padding-top:6px">${T(lastUpload)}</div>
      <div class="l">last upload</div></div>
  </div>`;
  if (status.unattachable) {
    h += `<div class="note">${status.unattachable} file(s) match the include patterns but no
      Item ID regex, so they will never upload. Check the regexes in Settings.</div>`;
  }
  if (stuck.length) {
    // No deadline on a file that is still failing means Sync now cleared
    // its backoff, so it goes on the next pass.
    h += `<div class="sec">Not uploading</div><div class="scroll"><table>
      <tr><th>File</th><th>Item</th><th>Attempts</th><th>Last failure</th><th>Next try</th><th>Error</th></tr>`;
    for (const r of stuck) {
      h += `<tr><td class="mono">${esc(r.path)}</td><td class="mono">${esc(r.itemId)}</td>
        <td class="mono">${r.attempts}</td><td>${T(r.lastErrorAt)}</td>
        <td>${r.nextTry > Date.now() ? T(r.nextTry) : "next pass"}</td>
        <td class="err mono">${esc(r.lastError)}</td></tr>`;
    }
    h += `</table></div>`;
  }
  if (recent.length) {
    h += `<div class="sec">Recently uploaded</div><div class="scroll"><table>
      <tr><th>File</th><th>Item</th><th>Size</th><th>When</th></tr>`;
    for (const r of recent) {
      h += `<tr><td class="mono">${esc(r.path)}</td><td class="mono">${esc(r.itemId)}</td>
        <td class="mono">${bytes(r.syncedSize)}</td><td>${T(r.lastSynced)}</td></tr>`;
    }
    h += `</table></div>`;
  }
  $("body").innerHTML = root || rows.length ? h : "";
  $("foot").textContent = "updated " + new Date().toLocaleTimeString();
}

// `now` is the Sync now button. Like the dashboard's, it also clears the
// backoff on failing files so they are retried on this pass.
async function syncOnce({ now = false } = {}) {
  if (!root) return;
  // Two open tabs would upload every file twice. The lock lets one sync at a time.
  await navigator.locks.request("beholder-sync", { ifAvailable: true }, async (lock) => {
    if (!lock) { log("another tab is syncing, skipped this run", "warn"); return; }
    // A half-typed regex in Settings would otherwise throw out of the timer unseen.
    let cfg;
    try { cfg = compileSettings(readSettings()); }
    catch (e) { setProblem(`Sync skipped, the settings are invalid: ${e.message}`); return; }
    if (!cfg.apiKey) { setProblem("Enter the API key in Settings, then Save settings."); return; }
    status.problem = null;
    status.syncing = true;
    await render();
    try {
      if (now) {
        for (const r of await filesAll()) if (r.nextTry) await filePut({ ...r, nextTry: 0 });
      }
      const { seen, unattachable } = await scan(root, cfg);
      status.unattachable = unattachable;
      await attachPending(cfg, seen);
      status.lastPassAt = Date.now();
    } catch (e) {
      log(`sync failed: ${e.message}`, "bad");
      status.problem = `The last sync stopped with an error: ${e.message}`;
    } finally {
      status.syncing = false;
    }
    await render();
  });
}

function schedule() {
  clearInterval(timer);
  const ms = Math.max(1, Number($("intervalMin").value) || DEFAULTS.intervalMin) * 60_000;
  status.nextAt = Date.now() + ms;
  timer = setInterval(() => { status.nextAt = Date.now() + ms; syncOnce(); }, ms);
}

// A page cannot open a folder by its path. From the config's path it can
// still start the dialog in a well-known folder on the way there, and check
// that the folder picked has the name the config expects.
const WELL_KNOWN = ["desktop", "documents", "downloads", "music", "pictures", "videos"];
function folderHints(path) {
  const parts = String(path || "").split(/[\\/]+/).filter(Boolean);
  const startIn = parts.map((x) => x.toLowerCase()).findLast((x) => WELL_KNOWN.includes(x));
  return { startIn, expected: parts.length > 1 ? parts.at(-1) : null };
}
function folderWarning(name, path) {
  const { expected } = folderHints(path);
  if (!expected || !name || name.toLowerCase() === expected.toLowerCase()) return null;
  return `You chose the folder "${name}", but the config watches "${expected}" (${path}). ` +
    "If that is not the folder the cycler writes to, click Choose a different folder.";
}

async function useFolder(handle) {
  root = handle;
  status.folderWarning = folderWarning(handle.name, await kvGet("configPath"));
  $("folderName").textContent = handle.name || "Chosen folder";
  $("folderHint").textContent = "Watching this folder and everything inside it.";
  $("pick").textContent = "Choose a different folder";
  $("resume").hidden = true;
  status.problem = null;
  schedule();
  await syncOnce();
}

$("pick").onclick = async () => {
  let handle;
  // The browser remembers the last folder picked under this id, and that
  // takes precedence over startIn after the first pick.
  const { startIn } = folderHints(await kvGet("configPath"));
  try { handle = await window.showDirectoryPicker({ id: "beholder-sync", mode: "read", ...(startIn && { startIn }) }); }
  catch (e) { if (e.name !== "AbortError") setProblem(`Could not open the folder: ${e.message}`); return; }
  await kvSet("folder", handle);
  await useFolder(handle);
};
$("resume").onclick = async () => {
  const handle = await kvGet("folder");
  if ((await handle.requestPermission({ mode: "read" })) === "granted") await useFolder(handle);
};
$("syncNow").onclick = () => syncOnce({ now: true });
$("save").onclick = async () => {
  const s = readSettings();
  try { compileSettings(s); } catch (e) { setProblem(`Settings not saved: ${e.message}`); return; }
  await kvSet("settings", s);
  log("settings saved");
  status.problem = null;
  if (root) schedule();
  await render();
};
$("loadYaml").onclick = async () => {
  try {
    const { cfg, skipped } = loadYamlLenient($("yaml").value);
    const { s, wp, dl, names, datalabChoices } =
      settingsFromConfig(cfg, $("pathName").value, $("datalabName").value);
    // With several datalabs or watched paths, the first load picks one and
    // shows a dropdown. Choosing another and pressing Load again loads it.
    $("datalabName").replaceChildren(...datalabChoices.map(([n, url]) => new Option(`${n} (${url})`, n)));
    $("datalabName").value = dl.name;
    $("datalabChoice").hidden = datalabChoices.length < 2;
    $("pathName").replaceChildren(...names.map((n) => new Option(n, n)));
    $("pathName").value = wp.name;
    $("pathChoice").hidden = names.length < 2;
    s.apiUrl = await resolveApiUrl(s.apiUrl);
    for (const [k, v] of Object.entries(s)) $(k).value = v;
    compileSettings(readSettings());
    await kvSet("settings", readSettings());
    log(`loaded watched path ${wp.name} for datalab ${dl.name} from config.yaml`, "ok");
    const problems = [];
    if (skipped.length) {
      problems.push(`Config loaded without ${skipped.map((k) => `line ${k.line} (${k.reason})`).join(", ")}. ` +
        "Those keys were left empty. Fix them in config.yaml and load again." + windowsPathHint(skipped));
    }
    if (!s.apiKey && !$("apiKey").value) {
      problems.push("The config has no api_key. Enter it in the API key box and Save settings.");
    }
    status.problem = problems.join(" ") || null;
    if ((wp.id_patterns || []).some((p) => p.includes("?P<group_id>"))) {
      log("this page does not share new items with a group_id; set sharing in datalab", "warn");
    }
    // "C:\temp" in double quotes parses, but \t becomes a tab.
    if (/[\x00-\x1f]/.test(wp.path || "")) {
      log(`the path ${JSON.stringify(wp.path)} holds a control character; quote Windows paths with single quotes`, "warn");
    }
    await kvSet("configPath", wp.path);
    if (root) status.folderWarning = folderWarning(root.name, wp.path);
    else if (wp.path) $("folderHint").textContent = `Choose the folder that matches ${wp.path} on this computer.`;
    if (root) schedule();
    await render();
  } catch (e) {
    setProblem(`Config not loaded: ${e.message}` + windowsPathHint([{ reason: e.message }]));
  }
};
// Inside double quotes YAML reads a backslash as an escape, so a pasted
// Windows path such as "C:\Users\..." fails to parse.
const windowsPathHint = (skipped) => skipped.some((k) => /escape sequence|hexadecimal character/.test(k.reason))
  ? " A Windows path needs single quotes ('C:\\Users\\...'), forward slashes, or doubled backslashes." : "";

(async () => {
  const s = await loadSettings();
  $("settings").open = !s.apiKey;
  // Keeps the "ago" times current between syncs, as the dashboard's poll does.
  setInterval(render, 15_000);
  if (!window.showDirectoryPicker) {
    status.unsupported = true;
    $("pick").disabled = true;
    await render();
    return;
  }
  await render();
  const handle = await kvGet("folder");
  if (!handle) return;
  // The grant survives a restart only if the user chose "Allow on every visit".
  if ((await handle.queryPermission({ mode: "read" })) === "granted") await useFolder(handle);
  else {
    $("folderName").textContent = handle.name;
    $("folderHint").textContent = "Chrome needs your permission again before it can read this folder.";
    $("resume").hidden = false;
    setProblem("Click Resume access to folder to continue syncing.");
  }
})();
// Exposed for the test harness, which drives a sync against a folder it builds.
window.beholder = { useFolder, syncOnce, filesAll, compileSettings, idsFor, globToRegex, settingsFromConfig, loadYamlLenient, folderHints, folderWarning };
</script>
</body>
</html>
